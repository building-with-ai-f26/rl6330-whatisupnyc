<!doctype html>
<html lang="en">
<head>
  {% include "partials/head.html" %}
  <title>{% block title %}{% endblock %} | whatisupnyc</title>
  <style>
    {% include "partials/base.css" %}
    .sign { padding-bottom: 24px; }
    .sign .row { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; }
    .sign a { font-size: 15px; }
    main { padding: clamp(24px, 4vw, 40px) var(--gutter) 72px; }
    .column { max-width: 520px; margin: 0 auto; }
    .notice { background: var(--taxi); border-radius: 4px; padding: 12px 16px; }
    label { display: block; font-weight: 600; margin: 20px 0 6px; }
    input[type=email], input[type=password] { width: 100%; font: inherit; padding: 12px 14px; border: 1px solid var(--black); border-radius: 4px; }
    form button { margin-top: 24px; }
    .links { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 24px; }
    input[type=text], textarea { width: 100%; font: inherit; padding: 12px 14px; border: 1px solid var(--black); border-radius: 4px; }
    fieldset { border: 0; padding: 0; margin: 20px 0 0; }
    legend { font-weight: 600; margin-bottom: 6px; }
    .days { display: flex; flex-wrap: wrap; gap: 8px 16px; }
    .days label { display: inline-flex; gap: 6px; align-items: center; font-weight: 400; margin: 0; }
  </style>
</head>
<body>
  <header class="sign">
    <div class="inner row">
      <div class="logo">{% include "partials/logo.svg" %}</div>
      <a href="/">Back to the start</a>
    </div>
  </header>
  <main>
    <div class="column">
      {% block content %}{% endblock %}
    </div>
  </main>
  {% include "partials/making.html" %}
</body>
</html>
