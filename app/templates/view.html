<!doctype html>
<html lang="en">
<head>
  {% include "partials/head.html" %}
  <title>List for {{ subscriber.name }} | whatisupnyc</title>
  <style>
    {% include "partials/base.css" %}
    .sign { padding-bottom: 24px; }
    .sign .row { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; }
    .sign a { font-size: 15px; }
    main { padding: clamp(24px, 4vw, 40px) var(--gutter) 72px; }
    .column { max-width: 620px; margin: 0 auto; }
    .for { color: var(--ink); margin: 0 0 24px; }
    .notice { background: var(--taxi); border-radius: 4px; padding: 12px 16px; }
  </style>
</head>
<body>
  <header class="sign">
    <div class="inner row">
      <div class="logo">{% include "partials/logo.svg" %}</div>
      <form method="post" action="/signout"><button class="plain" type="submit">Sign out</button></form>
    </div>
  </header>
  <main>
    <div class="column">
      <p class="for">For {{ subscriber.name }}. <a href="/preferences">Edit my preferences</a></p>
      {% if banner %}<p class="notice" role="status">{{ banner }}</p>{% endif %}
      {% if error %}<p class="notice" role="status">{{ error }}</p>{% endif %}
      {% if body %}<div id="issue">{{ body|safe }}</div>{% endif %}
    </div>
  </main>
</body>
</html>
