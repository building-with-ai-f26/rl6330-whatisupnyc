{% extends "partials/account_page.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<h2>Sign in</h2>
<p>Sign in to see your list.</p>
{% if message %}<p class="notice" role="status">{{ message }}</p>{% endif %}
<form method="post" action="/signin">
  <label for="email">Email</label>
  <input id="email" name="email" type="email" required autocomplete="email" value="{{ email }}">
  <label for="password">Password</label>
  <input id="password" name="password" type="password" required autocomplete="current-password">
  <button type="submit">Sign in</button>
</form>
<p class="links"><a href="/forgot">Forgot your password?</a><a href="/">New here? Make a list</a></p>
{% endblock %}
