{% extends "partials/account_page.html" %}
{% block title %}Choose a new password{% endblock %}
{% block content %}
<h2>Choose a new password</h2>
{% if message %}<p class="notice" role="status">{{ message }}</p>{% endif %}
<form method="post" action="/reset">
  <input type="hidden" name="token_hash" value="{{ token_hash }}">
  <label for="password">New password (at least 8 characters)</label>
  <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password">
  <button type="submit">Save my password</button>
</form>
{% endblock %}
